name: CMS cron — delivery

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_social-cron.yml
    with:
      job: delivery
    secrets:
      cron_secret: ${{ secrets.CRON_SECRET }}
      vercel_bypass_secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
