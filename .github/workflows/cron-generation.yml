name: CMS cron — generation

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_social-cron.yml
    with:
      job: generation
    secrets:
      cron_secret: ${{ secrets.CRON_SECRET }}
      vercel_bypass_secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
